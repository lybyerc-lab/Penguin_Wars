<svg xmlns="http://www.w3.org/2000/svg" width="48" height="32" viewBox="0 0 48 32">
  <!-- Determined / Mildly Annoyed Eyes in 3/4 view -->
  <!-- Rear Eye (left in 3/4 view, slightly foreshortened) -->
  <ellipse cx="14" cy="16" rx="4.5" ry="6.5" fill="#ffffff" stroke="#0c1722" stroke-width="2"/>
  <ellipse cx="15.5" cy="16" rx="2.8" ry="4.5" fill="#122232"/>
  <circle cx="16.5" cy="14.5" r="1.3" fill="#ffffff"/>
  <!-- Rear determined brow line angled down -->
  <path d="M 8,11 Q 14,14 19,13" fill="none" stroke="#0c1722" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Front Eye (right in 3/4 view, prominent) -->
  <ellipse cx="30" cy="15" rx="5.5" ry="7.5" fill="#ffffff" stroke="#0c1722" stroke-width="2.2"/>
  <ellipse cx="32" cy="15" rx="3.5" ry="5.2" fill="#122232"/>
  <circle cx="33.5" cy="13" r="1.6" fill="#ffffff"/>
  <!-- Front determined brow line angled firmly down -->
  <path d="M 23,10 Q 30,13 36,11" fill="none" stroke="#0c1722" stroke-width="2.8" stroke-linecap="round"/>
</svg>
