<svg xmlns="http://www.w3.org/2000/svg" width="100" height="80" viewBox="0 0 100 80">
  <defs>
    <linearGradient id="beakGrad" x1="0.1" y1="0.0" x2="0.6" y2="1.0">
      <stop offset="0%" stop-color="#ffbf42"/>
      <stop offset="60%" stop-color="#f8901e"/>
      <stop offset="100%" stop-color="#df6200"/>
    </linearGradient>
  </defs>

  <!-- Open yelling beak for Hit Reaction matching Pose 4 -->
  <!-- Upper beak wedge -->
  <path d="M 55,39 L 71,35 L 68,42 Z"
        fill="url(#beakGrad)" stroke="#0a121c" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Open mouth cavity -->
  <path d="M 55,40 C 63,40 68,44 65,50 C 60,53 55,48 55,40 Z"
        fill="#d83a52" stroke="#0a121c" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Tongue / inner highlight -->
  <path d="M 57,47 C 60,45 63,47 62,50 Z" fill="#ff7688"/>

  <!-- Lower beak wedge -->
  <path d="M 55,48 L 66,52 L 59,56 Z"
        fill="url(#beakGrad)" stroke="#0a121c" stroke-width="2.6" stroke-linejoin="round"/>
</svg>
