<svg xmlns="http://www.w3.org/2000/svg" width="32" height="40" viewBox="0 0 32 40">
  <!-- Scarf Tail: Articulated tail hanging from knot; pivot at (14, 4) -->
  <defs>
    <linearGradient id="tailGrad" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#dbebf0"/>
      <stop offset="100%" stop-color="#9abcc8"/>
    </linearGradient>
  </defs>
  <!-- Chunky folded fabric tail hanging down -->
  <path d="M 12,4 L 20,4 C 23,12 25,24 23,34 C 20,36 14,36 10,34 C 8,24 9,12 12,4 Z"
        fill="url(#tailGrad)" stroke="#1a3244" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Fringed hemline details -->
  <line x1="12" y1="31" x2="12" y2="35" stroke="#1a3244" stroke-width="1.8"/>
  <line x1="16" y1="31" x2="16" y2="35" stroke="#1a3244" stroke-width="1.8"/>
  <line x1="20" y1="31" x2="20" y2="35" stroke="#1a3244" stroke-width="1.8"/>
</svg>
