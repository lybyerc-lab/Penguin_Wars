<svg xmlns="http://www.w3.org/2000/svg" width="48" height="44" viewBox="0 0 48 44">
  <defs>
    <linearGradient id="tailGrad" x1="0.1" y1="0.0" x2="0.6" y2="1.0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#eaf3f7"/>
      <stop offset="100%" stop-color="#bdd4e0"/>
    </linearGradient>
  </defs>

  <!-- Dual fluttering scarf tail flaps -->
