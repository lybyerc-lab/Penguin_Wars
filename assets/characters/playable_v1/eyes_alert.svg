<svg xmlns="http://www.w3.org/2000/svg" width="48" height="32" viewBox="0 0 48 32">
  <!-- Alert / Focused / Friendly Eyes matching the Approved Character Presentation Sheet -->
  <!-- Rear Eye (left in 3/4 view) -->
  <ellipse cx="14" cy="16" rx="5" ry="7.5" fill="#0d1b2a" stroke="#081018" stroke-width="2"/>
  <!-- Specular glint 1 (large top-left) -->
  <circle cx="12.5" cy="13" r="2.2" fill="#ffffff"/>
  <!-- Specular glint 2 (small bottom-right) -->
  <circle cx="16" cy="18.5" r="1.1" fill="#ffffff"/>

  <!-- Front Eye (right in 3/4 view, prominent) -->
  <ellipse cx="30" cy="15" rx="6.5" ry="9" fill="#0d1b2a" stroke="#081018" stroke-width="2.2"/>
  <!-- Specular glint 1 (large top-left) -->
  <circle cx="28" cy="11.5" r="2.8" fill="#ffffff"/>
  <!-- Specular glint 2 (small bottom-right) -->
  <circle cx="32.5" cy="18" r="1.3" fill="#ffffff"/>
</svg>
