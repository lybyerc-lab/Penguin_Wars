<svg xmlns="http://www.w3.org/2000/svg" width="100" height="80" viewBox="0 0 100 80">
  <defs>
    <linearGradient id="beakGrad" x1="0.1" y1="0.0" x2="0.6" y2="1.0">
      <stop offset="0%" stop-color="#ffc34d"/>
      <stop offset="60%" stop-color="#f8901e"/>
      <stop offset="100%" stop-color="#dc5c00"/>
    </linearGradient>
  </defs>

  <!-- Cute triangular wedge beak matching Concept C Pose 1 -->
  <path d="M 54,43
           C 60,40 68,41 74,44
           C 77,47 75,51 70,55
           C 64,57 58,54 54,49
           C 53,46 53,44 54,43 Z"
        fill="url(#beakGrad)" stroke="#0a121c" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Beak top ridge highlight -->
  <path d="M 57,43.5 C 63,42 69,43 73,45"
        fill="none" stroke="#ffebaa" stroke-width="1.8" stroke-linecap="round"/>
</svg>
