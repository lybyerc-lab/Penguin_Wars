    <linearGradient id="flipFrontGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f445c"/>
      <stop offset="100%" stop-color="#142130"/>
    </linearGradient>
  </defs>
  <!-- Curving teardrop flipper with rounded paddle tip -->
