<svg xmlns="http://www.w3.org/2000/svg" width="28" height="20" viewBox="0 0 28 20">
  <!-- KO Indicator: Cute chunky cartoon fish with X eye -->
  <defs>
    <linearGradient id="fishGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#72cce8"/>
      <stop offset="100%" stop-color="#3c92b2"/>
    </linearGradient>
  </defs>
  <!-- Fish body & tail -->
  <path d="M 6,10 C 10,5 18,5 22,9 L 26,6 L 25,14 L 22,11 C 18,15 10,15 6,10 Z"
        fill="url(#fishGrad)" stroke="#16384a" stroke-width="2" stroke-linejoin="round"/>
  <!-- Light belly -->
  <path d="M 9,11 C 13,13 17,13 20,11 C 17,14 12,14 9,11 Z" fill="#e0f6fc"/>
  <!-- Dazed X eye -->
  <line x1="8" y1="8" x2="11" y2="11" stroke="#16384a" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="11" y1="8" x2="8" y2="11" stroke="#16384a" stroke-width="1.8" stroke-linecap="round"/>
</svg>
