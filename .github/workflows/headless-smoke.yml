name: Penguin Wars Headless Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - planning/**
      - feature/**
  pull_request:

permissions:
  contents: read

concurrency:
  group: headless-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Verify Godot
        run: godot --version

      - name: Import project
        run: godot --headless --path . --editor --import --quit

      - name: Foundation integration test
        run: godot --headless --path . --script res://tests/foundation_test.gd

      - name: Mobile expedition entry smoke
        run: godot --headless --path . --script res://tests/mobile_expedition_test.gd

      - name: Phase A combat smoke
        run: godot --headless --path . --script res://tests/phase_a_combat_test.gd

      - name: Phase A route smoke
        run: godot --headless --path . --script res://tests/phase_a_route_test.gd